[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Serverless functions are picked up from netlify/functions/ automatically.

[[headers]]
  # All assets
  for = "/assets/*"
  [headers.values]
    cache-control = "public, max-age=31536000, immutable"

[[headers]]
  # HTML files
  for = "/*.html"
  [headers.values]
    cache-control = "public, max-age=0, must-revalidate"